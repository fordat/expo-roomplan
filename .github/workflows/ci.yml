name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-js:
    name: Build TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            example/package-lock.json

      - run: npm ci

      - run: npm run lint

      # expo-module build runs tsc once (no watch) when CI is set, which GitHub does.
      - run: npm run build

      - name: Install example dependencies
        working-directory: example
        run: npm ci

      - name: Typecheck example
        working-directory: example
        run: npm run typecheck

  build-ios:
    name: Build iOS example app
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            example/package-lock.json

      # The example depends on this package via "file:..", which makes npm run
      # the package's `prepare` script, which needs the root devDependencies.
      - name: Install package dependencies
        run: npm ci

      - name: Install example dependencies
        working-directory: example
        run: npm ci

      # The example uses Continuous Native Generation: ios/ isn't committed, so
      # generate it from app.json + config plugins. Runs before the Pods cache
      # restore because --clean would delete a restored ios/Pods.
      - name: Generate iOS project
        working-directory: example
        run: npx expo prebuild --platform ios --no-install --clean

      - name: Cache Pods
        uses: actions/cache@v4
        with:
          path: example/ios/Pods
          key: pods-macos-26-${{ hashFiles('example/package-lock.json', 'example/app.json', 'ios/ExpoRoomplan.podspec') }}
          restore-keys: pods-macos-26-

      - name: Install pods
        working-directory: example/ios
        run: pod install

      # Builds for a generic device (not the simulator) with signing disabled,
      # so no Apple developer certificate is needed. SKIP_BUNDLING skips the
      # JS bundle step, since this job only checks that the native code compiles.
      # The raw log is kept because xcbeautify drops some errors (e.g. Swift
      # Package Manager resolution failures).
      - name: Build
        working-directory: example/ios
        run: |
          set -o pipefail
          xcodebuild \
            -workspace exporoomplanexample.xcworkspace \
            -scheme exporoomplanexample \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            SKIP_BUNDLING=1 \
            build | tee xcodebuild.log | xcbeautify --renderer github-actions

      - name: Show xcodebuild errors
        if: failure()
        working-directory: example/ios
        run: grep -n -B2 -A12 -E "error:|Could not resolve" xcodebuild.log | tail -200 || true
